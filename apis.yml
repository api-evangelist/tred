description: TRED is a Seattle-based peer-to-peer online marketplace for buying and selling used
  cars, founded in 2011 and backed by Techstars, Maveron, Lowercase Capital, and Founders' Co-op.
  The platform let private buyers and sellers list vehicles, ask questions, schedule concierge-delivered
  test drives, and complete financed purchases online, with concierges compensated on customer-service
  reviews rather than sales commission. The tred.com domain now resolves to Cox Automotive / Autotrader
  infrastructure, indicating TRED has been absorbed into Cox Automotive; it operates as a consumer web
  product with no public developer program, API, or documentation surface as of this enrichment pass.
